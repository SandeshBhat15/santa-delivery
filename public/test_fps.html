<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background: #111; color: #00ffcc; font-size: 36px; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
</style>
</head>
<body>
<div id="fps">FPS: --</div>
<script>
let frames = 0;
let last = performance.now();
const el = document.getElementById('fps');
function loop(now) {
    frames++;
    if (now - last >= 1000) {
        el.textContent = 'RAW BROWSER FPS: ' + frames;
        frames = 0;
        last = now;
    }
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
