<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f19" />
    <title>Santa's Sleigh Run — 5 Delivery Dash</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts are self-hosted (src/fonts) because a Web Lens may not load
         fonts.googleapis.com. See scripts/fetch-fonts.mjs. -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D Canvas will be injected or rendered here -->
    <div id="app"></div>

    <!-- Cinematic Vignette Overlay -->
    <div id="game-vignette" class="game-vignette" aria-hidden="true"></div>

    <!-- UI Overlay for HUD / Controls -->
    <div id="ui-container">
      <div id="debug-info" style="display: none;">
        <span id="fps-counter">FPS: --</span>
      </div>
      <div id="hint-info">
        <span>[W] / [S]: Climb &amp; Dive | [A] / [D]: Steer | [G]: Guide Wind</span>
      </div>
    </div>

    <!-- Loading Screen -->
    <div id="loader" class="festive-loader">
      <div class="loader-bg-overlay"></div>
      <div class="loader-content">
        <!-- Festive Holiday Game Logo -->
        <div class="loader-logo-wrapper">
          <img src="/assets/custom_ui/logo_holiday.png" alt="Santa's Gift Run" class="loader-logo-img" />
        </div>

        <!-- Festive Loading Stage -->
        <div class="loader-card">
          <h2 class="loader-subheading">DELIVERING THE HOLIDAYS...</h2>

          <!-- Candy Cane Progress Bar Capsule -->
          <div class="loader-progress-capsule">
            <div class="progress-snow-trim-left"></div>
            <div class="progress-bar-bg">
              <div id="progress-bar" class="candy-stripe-progress">
                <span class="progress-glow-head"></span>
              </div>
            </div>
            <div class="progress-snow-trim-right"></div>
          </div>

          <!-- Percentage & Status -->
          <div class="loader-status-row">
            <span id="loader-status" class="loader-percentage">0%</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { UIManager } from '/src/ui/UIManager.js';
      const uiManager = new UIManager();
      window.UIManager = UIManager;
      window.uiManager = uiManager;
      uiManager.init(document.getElementById('ui-container'));
    </script>
  </body>
</html>
