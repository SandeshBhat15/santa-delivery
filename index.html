<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Santa's Sleigh Run — 5 Delivery Dash</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Lilita+One&family=Berkshire+Swash&family=Cinzel:wght@600;700;800;900&family=Cinzel+Decorative:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D Canvas will be injected or rendered here -->
    <div id="app"></div>

    <!-- Cinematic Vignette Overlay -->
    <div id="game-vignette" class="game-vignette" aria-hidden="true"></div>

    <!-- UI Overlay for HUD / Controls -->
    <div id="ui-container">
      <div id="debug-info" style="display: none;">
        <span id="fps-counter">FPS: --</span>
      </div>
      <div id="hint-info">
        <span>[W] / [S]: Climb &amp; Dive | [A] / [D]: Steer | [G]: Guide Wind</span>
      </div>
    </div>

    <!-- Loading Screen -->
    <div id="loader">
      <div class="loader-content">
        <h2>Loading Winter World...</h2>
        <div class="progress-bar-bg">
          <div id="progress-bar"></div>
        </div>
        <p id="loader-status">0%</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { UIManager } from '/src/ui/UIManager.js';
      const uiManager = new UIManager();
      window.UIManager = UIManager;
      window.uiManager = uiManager;
      uiManager.init(document.getElementById('ui-container'));
    </script>
  </body>
</html>
